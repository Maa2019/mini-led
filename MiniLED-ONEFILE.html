<style>
:root{
  --bg:#0B1024; --panel:#151C3A; --panel2:#1B2450; --line:#2C3768;
  --cyan:#3BB8F0; --gold:#F5B617; --red:#EF2B36; --green:#31B85C;
  --violet:#8B5CF6; --txt:#E4EAFA; --mute:#94A2CE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;overscroll-behavior-y:contain}
body{background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
.hide{display:none!important}
button{font-family:inherit}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:60;background:rgba(11,16,36,.94);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 11px) 15px 11px}
.hrow{display:flex;align-items:center;gap:10px}
.back{background:var(--panel);border:1px solid var(--line);color:var(--txt);
  border-radius:9px;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer}
h1{margin:0;font-size:16.5px;font-weight:800;color:#fff;letter-spacing:.2px}
.tag{font-size:11px;color:var(--mute);margin-top:1px}
.flag{width:24px;height:16px;border-radius:2px;overflow:hidden;display:flex;
  flex-direction:column;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,.16)}
.flag i{flex:1}.flag i:nth-child(1){background:#FF9933}
.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#138808}

.wrap{padding:15px;max-width:840px;margin:0 auto}
.sec{font-size:10.5px;letter-spacing:1.8px;color:var(--cyan);font-weight:800;
  margin:22px 0 10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:15px;margin-bottom:12px}
.card h3{margin:0 0 9px;font-size:10.5px;letter-spacing:1.5px;font-weight:800;
  color:var(--cyan)}
.big{font-size:19px;font-weight:800;color:#fff;line-height:1.3}
.p{font-size:14px;color:var(--txt);margin-top:7px}
.mut{font-size:12.5px;color:var(--mute)}

/* ---------- TV ---------- */
.tvwrap{display:flex;flex-direction:column;align-items:center;margin:2px 0 6px}
.tv{width:100%;max-width:360px}
.bezel{padding:7px;border-radius:12px;
  background:linear-gradient(160deg,#465182,#141A33 58%,#28315C);
  box-shadow:0 14px 30px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07)}
.scr{position:relative;width:100%;aspect-ratio:16/9;border-radius:6px;
  overflow:hidden;background:#02030A}
.neck{width:34px;height:13px;margin:0 auto;background:linear-gradient(180deg,#454F7E,#232B52)}
.base{width:118px;height:6px;margin:0 auto;border-radius:0 0 5px 5px;
  background:linear-gradient(180deg,#454F7E,#1C2246);box-shadow:0 7px 16px rgba(0,0,0,.55)}
.brandbar{text-align:center;font-size:8px;letter-spacing:3.6px;font-weight:800;
  color:#7C8AB8;margin-top:5px}
.caption{font-size:12px;color:var(--mute);text-align:center;margin-top:9px}

/* zone grid */
.zones{position:absolute;inset:0;display:grid;gap:0}
.z{background:#000;transition:background .32s ease, box-shadow .32s ease}
.lcd{position:absolute;inset:0;pointer-events:none}
.vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(0,0,0,.5) 100%)}
.shine{position:absolute;top:0;left:0;width:40%;height:100%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.14),transparent);
  transform:translateX(-140%)}
.ovl{position:absolute;left:9px;top:8px;font-size:9px;font-weight:800;
  letter-spacing:1.5px;color:rgba(255,255,255,.9);text-shadow:0 1px 4px #000}
.ovr{position:absolute;right:8px;top:7px;font-size:8px;font-weight:800;
  letter-spacing:.8px;color:#0B1024;background:var(--gold);border-radius:3px;
  padding:3px 6px}
.nits{position:absolute;right:9px;bottom:8px;font-size:11px;font-weight:900;
  color:#fff;text-shadow:0 1px 6px #000}

/* toggle / controls */
.seg{display:flex;gap:6px;margin-top:11px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);
  color:var(--mute);border-radius:10px;padding:10px 6px;font-size:12.5px;
  font-weight:700;cursor:pointer;transition:all .2s}
.seg button.on{background:var(--cyan);border-color:var(--cyan);color:#06121E}
.slab{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);
  margin:12px 0 5px}
input[type=range]{width:100%;accent-color:var(--cyan);height:26px}

/* stat bars */
.bar{margin-bottom:11px}
.bl{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
.bl b{color:#fff}
.bt{height:9px;border-radius:5px;background:#0E1430;overflow:hidden}
.bt i{display:block;height:100%;border-radius:5px;width:0;transition:width .9s cubic-bezier(.2,.9,.3,1)}

/* feature rows */
.fr{display:flex;gap:11px;padding:11px 2px;border-bottom:1px solid #232C57}
.fr:last-child{border-bottom:none}
.fn{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#08101F}
.fh{font-size:15px;font-weight:800;color:#fff}
.fb{font-size:13px;color:var(--mute);margin-top:2px}

/* home tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:22px}
.tile .tt{font-size:14.5px;font-weight:800;color:#fff;margin-top:7px}
.tile .ts{font-size:11.5px;color:var(--mute);margin-top:2px}
.tile.wide{grid-column:1/-1}

/* model list */
.mrow{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:13px;display:flex;align-items:center;gap:12px;cursor:pointer;
  margin-bottom:11px;transition:transform .12s}
.mrow:active{transform:scale(.985)}
.mtv{flex:0 0 auto;width:62px}
.mtv .bezel{padding:3px;border-radius:6px}.mtv .scr{border-radius:3px}
.mtv .neck{width:15px;height:5px}.mtv .base{width:36px;height:3px}
.chip{display:inline-block;font-size:10.5px;font-weight:900;color:#08101F;
  border-radius:5px;padding:2px 7px;margin-right:7px;vertical-align:1px}
.mn{font-size:15.5px;font-weight:800;color:#fff}
.ms{font-size:12px;color:var(--mute);margin-top:2px}
.chev{margin-left:auto;color:var(--mute);font-size:20px}

/* tabs */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 15px;
  border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;
  background:rgba(11,16,36,.96);backdrop-filter:blur(10px)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
  color:var(--mute);border-radius:20px;padding:8px 15px;font-size:12.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab.on{background:var(--cyan);border-color:var(--cyan);color:#06121E}

/* quiz */
.qn{font-size:11px;letter-spacing:1.4px;color:var(--gold);font-weight:800}
.qq{font-size:17px;font-weight:800;color:#fff;margin:8px 0 14px;line-height:1.35}
.opt{width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  color:var(--txt);border-radius:11px;padding:13px;font-size:14px;margin-bottom:9px;
  cursor:pointer;transition:all .2s}
.opt.ok{background:#0F3A22;border-color:var(--green);color:#B8F0CC}
.opt.no{background:#3A1216;border-color:var(--red);color:#FFC4C8}
.opt:disabled{cursor:default}
.exp{background:#0E1836;border:1px solid var(--line);border-radius:11px;padding:12px;
  font-size:13px;color:var(--mute);margin-top:4px}
.btn{width:100%;background:var(--cyan);border:none;color:#06121E;border-radius:11px;
  padding:14px;font-size:15px;font-weight:800;cursor:pointer;margin-top:11px}
.btn.ghost{background:var(--panel2);border:1px solid var(--line);color:var(--txt)}
.prog{height:6px;border-radius:4px;background:#0E1430;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));
  transition:width .4s ease}
.score{font-size:46px;font-weight:900;color:var(--gold);text-align:center;line-height:1}

/* layer stack */
.stack{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.ly{border-radius:10px;padding:11px 13px;border:1px solid var(--line)}
.ly b{font-size:14px;color:#fff;display:block}
.ly span{font-size:12px;color:var(--mute)}

footer{padding:24px 15px calc(env(safe-area-inset-bottom) + 28px);text-align:center;
  font-size:11px;color:#56638F;line-height:1.6}


/* ================= LIVE DEMO MODULES ================= */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip2{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);
  color:var(--mute);border-radius:18px;padding:8px 14px;font-size:12.5px;
  font-weight:700;cursor:pointer;white-space:nowrap;transition:all .2s;
  position:relative;overflow:hidden}
.chip2.on{background:var(--gold);border-color:var(--gold);color:#1A1405}

/* colour swatches */
.sw{position:absolute;left:8px;right:8px;top:26%;display:grid;
  grid-template-columns:repeat(6,1fr);gap:4px}
.sw div{height:26px;border-radius:4px;transition:background .5s ease,box-shadow .5s ease}
.swlab{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:9.5px;
  font-weight:800;letter-spacing:1.4px;color:#fff;text-shadow:0 1px 5px #000}

/* gamut triangle */
.gam{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gam svg{width:62%;height:82%}
.gpoly{transition:all .8s cubic-bezier(.2,.9,.3,1)}

/* colour counter */
.cnt{position:absolute;left:0;right:0;top:34%;text-align:center;
  font-size:26px;font-weight:900;color:#fff;letter-spacing:.5px;
  text-shadow:0 2px 12px rgba(0,0,0,.9)}
.cntsub{position:absolute;left:0;right:0;top:56%;text-align:center;font-size:9px;
  font-weight:800;letter-spacing:2.4px;color:rgba(255,255,255,.75)}

/* audio */
.spk{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:16px}
.cone{width:30px;height:30px;border-radius:50%;
  background:radial-gradient(circle at 40% 36%,#5A6690,#1A2140 70%);
  border:2px solid #6E7BA8;position:relative}
.cone.big{width:42px;height:42px}
.cone::after{content:"";position:absolute;inset:31%;border-radius:50%;background:#8794C4}
.cone.pump{animation:pump .5s ease-in-out infinite}
.cone.pump.slow{animation-duration:.75s}
.ring{position:absolute;border:2px solid rgba(120,200,255,.6);border-radius:50%;
  left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;opacity:0}
.ring.go{animation:ripOut 1.9s ease-out infinite}
.atm{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 9px var(--gold)}
.atm.go{animation:orbit 3.4s linear infinite}
.chlab{position:absolute;left:0;right:0;top:16%;text-align:center;font-size:11px;
  font-weight:800;letter-spacing:1.6px;color:#fff;text-shadow:0 1px 6px #000}

/* airplay */
.phone{position:absolute;left:9px;bottom:10px;width:32px;height:56px;border-radius:6px;
  background:linear-gradient(160deg,#3A4570,#171E3C);border:1.5px solid #737FAE}
.phone i{position:absolute;inset:4px 3px 6px;border-radius:3px;
  background:linear-gradient(150deg,#1E7FD0,#8B5CF6)}
.phone b{position:absolute;bottom:1.5px;left:50%;width:10px;height:2px;margin-left:-5px;
  border-radius:2px;background:#737FAE}
.fly{position:absolute;left:14px;bottom:26px;width:22px;height:14px;border-radius:3px;
  background:linear-gradient(150deg,#1E7FD0,#8B5CF6);opacity:0}
.fly.go{animation:flyUp 2.6s cubic-bezier(.3,.8,.4,1) infinite}
.apwave{position:absolute;left:20px;bottom:60px;width:12px;height:12px;
  border:2px solid rgba(120,200,255,.7);border-top:none;border-left:none;
  transform:rotate(-45deg);opacity:0}
.apwave.go{animation:apPulse 1.9s ease-out infinite}

/* voice */
.mic{position:absolute;left:11px;bottom:12px;width:22px;height:22px;border-radius:50%;
  background:#233060;border:2px solid #6E7BA8;display:flex;align-items:center;
  justify-content:center;font-size:11px;color:#B9C6EE}
.vw{position:absolute;left:19px;bottom:20px;width:12px;height:12px;border-radius:50%;
  border:2px solid rgba(120,200,255,.65);opacity:0}
.vw.go{animation:vOut 2.2s ease-out infinite}
.vtext{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:13px;
  font-weight:800;color:#fff;text-shadow:0 1px 8px #000;opacity:0}
.vtext.go{animation:vShow 4.4s ease-in-out infinite}

/* latency meter */
.lat{position:absolute;left:12px;right:12px;top:40%}
.latbar{height:12px;border-radius:7px;background:#0B1430;overflow:hidden;
  border:1px solid #2C3768}
.latbar i{display:block;height:100%;border-radius:7px;transition:width .7s cubic-bezier(.2,.9,.3,1)}
.latlab{display:flex;justify-content:space-between;font-size:10px;font-weight:800;
  color:#fff;margin-top:6px;text-shadow:0 1px 5px #000}

/* sun overlay */
.sun{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,250,235,0) 30%,rgba(255,250,235,.55) 100%);
  opacity:0;transition:opacity .5s ease}
.sun.on{opacity:1}

/* teach points */
.tp{display:flex;gap:10px;padding:10px 2px;border-bottom:1px solid #232C57}
.tp:last-child{border-bottom:none}
.tpd{flex:0 0 auto;width:8px;height:8px;border-radius:50%;margin-top:7px}
.tpt{font-size:13.5px;color:var(--txt)}
.tpt b{color:#fff}

@keyframes pump{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes ripOut{0%{width:20px;height:20px;margin:-10px 0 0 -10px;opacity:.85}
  100%{width:150px;height:150px;margin:-75px 0 0 -75px;opacity:0}}
@keyframes orbit{0%{transform:translate(0,0)}25%{transform:translate(58px,-16px)}
  50%{transform:translate(116px,0)}75%{transform:translate(58px,16px)}
  100%{transform:translate(0,0)}}
@keyframes flyUp{0%{opacity:0;transform:translate(0,0) scale(.5)}
  15%{opacity:1}
  70%{opacity:1;transform:translate(105px,-46px) scale(3.4)}
  85%{opacity:0;transform:translate(105px,-46px) scale(3.8)}
  100%{opacity:0}}
@keyframes apPulse{0%{opacity:0;transform:rotate(-45deg) scale(.5)}
  30%{opacity:.9}100%{opacity:0;transform:rotate(-45deg) scale(1.7)}}
@keyframes vOut{0%{opacity:.8;width:12px;height:12px}
  100%{opacity:0;width:96px;height:96px;margin:-42px 0 0 -42px}}
@keyframes vShow{0%,12%{opacity:0}24%,64%{opacity:1}80%,100%{opacity:0}}

/* ================= ANIMATION ================= */
@keyframes fadeUp{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}62%{transform:scale(1.14)}100%{transform:scale(1);opacity:1}}
@keyframes powerOn{0%{transform:scaleY(.014);opacity:0;filter:brightness(3.2)}
  46%{transform:scaleY(.014);opacity:1;filter:brightness(3.2)}
  100%{transform:scaleY(1);opacity:1;filter:brightness(1)}}
@keyframes scan{0%{transform:translateX(-140%)}100%{transform:translateX(340%)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes ripple{to{transform:scale(2.6);opacity:0}}
@keyframes featCycle{0%{opacity:0;transform:translateY(10px) scale(.9);filter:blur(3px)}
  4%{opacity:1;transform:none;filter:blur(0)}
  21%{opacity:1;transform:none;filter:blur(0)}
  25%{opacity:0;transform:translateY(-9px) scale(1.05);filter:blur(3px)}
  100%{opacity:0}}
@keyframes dotCycle{0%,1%{background:rgba(255,255,255,.28);transform:scale(1)}
  4%,21%{background:#fff;transform:scale(1.35);box-shadow:0 0 7px rgba(255,255,255,.85)}
  25%,100%{background:rgba(255,255,255,.28);transform:scale(1)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(calc(100% - 26px))}}

@media (prefers-reduced-motion: no-preference){
  .scr{animation:powerOn .7s cubic-bezier(.2,.9,.3,1) both}
  .shine{animation:scan 4s 1.2s ease-in-out infinite}
  .card,.tile,.mrow{animation:fadeUp .4s cubic-bezier(.22,.9,.3,1) both}
  .tiles .tile:nth-child(1){animation-delay:.04s}
  .tiles .tile:nth-child(2){animation-delay:.09s}
  .tiles .tile:nth-child(3){animation-delay:.14s}
  .tiles .tile:nth-child(4){animation-delay:.19s}
  .tiles .tile:nth-child(5){animation-delay:.24s}
  .mrow:nth-child(2){animation-delay:.06s}.mrow:nth-child(3){animation-delay:.12s}
  .mrow:nth-child(4){animation-delay:.18s}.mrow:nth-child(5){animation-delay:.24s}
  .fr{animation:slideIn .3s cubic-bezier(.22,.9,.3,1) both}
  .fr:nth-child(2){animation-delay:.05s}.fr:nth-child(3){animation-delay:.10s}
  .fr:nth-child(4){animation-delay:.15s}.fr:nth-child(5){animation-delay:.20s}
  .fn{animation:pop .34s cubic-bezier(.3,1.5,.5,1) both;animation-delay:inherit}
  .ly{animation:fadeUp .4s cubic-bezier(.22,.9,.3,1) both}
  .ly:nth-child(2){animation-delay:.08s}.ly:nth-child(3){animation-delay:.16s}
  .ly:nth-child(4){animation-delay:.24s}

function rippleAt(el, ev){
  try{
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height);
    const s = document.createElement("span");
    s.className = "rip"; s.style.width = s.style.height = d + "px";
    s.style.left = ((ev && ev.clientX ? ev.clientX : r.left + r.width/2) - r.left - d/2) + "px";
    s.style.top  = ((ev && ev.clientY ? ev.clientY : r.top + r.height/2) - r.top - d/2) + "px";
    el.appendChild(s); setTimeout(()=>s.remove(), 600);
  }catch(e){}
}
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* Build a backlight zone grid.
   cols x rows zones. scene(x,y) returns 0..1 brightness for that zone. */
function zoneGrid(cols, rows, scene, tint){
  let cells = "";
  for (let y = 0; y < rows; y++){
    for (let x = 0; x < cols; x++){
      const v = Math.max(0, Math.min(1, scene(x/(cols-1||1), y/(rows-1||1))));
      const c = tint ? tint(v) : ('rgba(' + [255,255,255].join(',') + ',' + v + ')');
      const glow = v > .35 ? 'box-shadow:0 0 ' + (10*v).toFixed(1) + 'px rgba(160,205,255,' + (v*.5).toFixed(2) + ')' : '';
      cells += '<div class="z" style="background:' + c + ';' + glow + '"></div>';
    }
  }
  return '<div class="zones" style="grid-template-columns:repeat(' + cols +
         ',1fr);grid-template-rows:repeat(' + rows + ',1fr)">' + cells + '</div>';
}

/* night scene: a bright moon top-right + a few stars, rest near black */
function nightScene(x, y){
  const dx = x - .74, dy = y - .26;
  const moon = Math.exp(-((dx*dx)/0.006 + (dy*dy)/0.012));
  const stars = Math.exp(-((x-.18)**2/0.002 + (y-.62)**2/0.004)) * .55
              + Math.exp(-((x-.42)**2/0.0016 + (y-.18)**2/0.003)) * .42
              + Math.exp(-((x-.60)**2/0.0014 + (y-.76)**2/0.003)) * .38;
  return Math.min(1, moon + stars + .012);
}

/* ---------------- WHY MINI-LED ---------------- */
let nits = 1400, dvOn = true, memcOn = true;

  const f = nits / 1400;
  const inner = zoneGrid(20,11,(x,y)=>{
      const sun = Math.exp(-((x-.72)**2/0.012 + (y-.24)**2/0.02));
      const mid = Math.exp(-((x-.36)**2/0.09 + (y-.60)**2/0.06))*.45;
      return Math.min(1, sun*f + mid*(0.35+0.65*f) + .02);
    }, v => {
      const warm = dvOn;
      const r = warm ? 255 : 205, g = warm ? 236 : 208, b = warm ? 190 : 215;
      return 'rgba(' + r + ',' + g + ',' + b + ',' + (0.03 + 0.97*v).toFixed(3) + ')';
    }) +
    '<div class="ovl">' + (dvOn ? "DOLBY VISION" : "SDR") + '</div>' +
    '<div class="nits">' + nits + ' nits</div>';
  return inner;
}

    '<div class="p mut">Google TV line: 55", 65", 75" at 1400 nits.<br>' +
    'WebOS line: 55", 65" at 1000 nits.</div></div>';
  h += '<div class="sec">GOOGLE TV 5.0  ·  1400 NITS</div>';
  MODELS.filter(m=>m.line==="gtv").forEach(m=>h+=mrow(m));
  h += '<div class="sec">WEBOS  ·  1000 NITS  ·  MAGIC REMOTE</div>';
  MODELS.filter(m=>m.line==="web").forEach(m=>h+=mrow(m));
  h += '<div class="card mut" style="font-size:12.5px">Model codes were not in the launch deck. ' +
       'Add the SKU numbers when the price list is circulated.</div>';
  return h;
}
function mrow(m){
  return '<div class="mrow" data-m="' + m.id + '">' + miniTV(m) +
    '<div style="min-width:0"><div class="mn">' +
    '<span class="chip" style="background:' + m.color + '">' + m.size + '</span>' +
    (m.line==="gtv" ? "Google TV" : "WebOS") + '</div>' +
    '<div class="ms">' + m.spec + '</div></div><div class="chev">›</div></div>';
}
function wireModels(){
  document.querySelectorAll("[data-m]").forEach(el=>{
    el.onclick = ev => { rippleAt(el,ev); setTimeout(()=>go("model", el.dataset.m),120); };
  });
}

/* ---------------- MODEL DETAIL ---------------- */
function renderTabs(){
  $("tabsBar").innerHTML = MTABS.map(t=>
    '<button class="tab' + (t[0]===tab?" on":"") + '" data-t="' + t[0] + '">' + t[1] + '</button>'
  ).join("");
  document.querySelectorAll(".tab").forEach(b=>{
    b.onclick = ev => { rippleAt(b,ev); tab = b.dataset.t; renderTabs();
      $("screen").innerHTML = vModel(); wireModel();
      window.scrollTo({top:0,behavior:"smooth"}); };
  });
}
function modelTV(m){
  let feats = "", dots = "";
  m.hi.forEach((t,i)=>{
    const p = t.split("|");
    feats += '<span style="animation-delay:' + (i*2.5) + 's">' + p[0] +
             (p[1] ? '<i>' + p[1] + '</i>' : '') + '</span>';
    dots  += '<b style="animation-delay:' + (i*2.5) + 's"></b>';
  });
  const f = m.nits/1400;
  const inner = zoneGrid(m.zones[0], m.zones[1], (x,y)=>{
      const c = Math.exp(-((x-.5)**2/0.12 + (y-.45)**2/0.10));
      return Math.min(1, c*(0.55+0.45*f) + .04);
    }, v => 'rgba(' + Math.round(45+150*v) + ',' + Math.round(100+125*v) + ',' +
            Math.round(190+65*v) + ',' + (0.12+0.88*v).toFixed(3) + ')') +
    '<div class="ovl">' + (m.line==="gtv" ? "GOOGLE TV 5.0" : "WEBOS") + '</div>' +
    '<div class="ovr">' + m.nits + ' NITS</div>' +
    '<div class="feathero">' + feats + '</div><div class="dots">' + dots + '</div>';
  return tvShell(inner, {cap: m.size + '  ·  ' + m.nits + ' nits  ·  backlight zones shown for illustration'});
}
function vModel(){
  const m = model; let h = modelTV(m);
  if (tab === "feat"){
    h += '<div class="card"><h3>5 KEY FEATURES &amp; WHAT THEY MEAN</h3>';
    m.feats.forEach((f,i)=>{
      h += '<div class="fr"><div class="fn" style="background:' + m.color + '">' + (i+1) + '</div>' +
        '<div><div class="fh">' + esc(f[0]) + '</div><div class="fb">' + esc(f[1]) + '</div></div></div>';
    });
    h += '</div>';
  }
  if (tab === "demo"){
    h += '<div class="card"><h3>DEMO — IN THIS ORDER</h3>';
    m.demo.forEach((d,i)=>{
      h += '<div class="fr"><div class="fn" style="background:' + m.color + '">' + (i+1) + '</div>' +
        '<div><div class="fb" style="color:var(--txt);font-size:14px">' + esc(d) + '</div></div></div>';
    });
    h += '</div>';
  }
  if (tab === "pitch"){
    h += '<div class="card"><h3>SAY THIS</h3>' +
      '<div class="big" style="font-style:italic;font-size:17px">“' + esc(m.pitch) + '”</div></div>' +
      '<div class="card"><h3>FOUR BEATS</h3><div style="font-size:14px;line-height:1.9">' +
      '<b style="color:#fff">HOOK</b> — a question<br><b style="color:#fff">PROOF</b> — show it on screen<br>' +
      '<b style="color:#fff">GAIN</b> — his room, not a spec<br><b style="color:#fff">CLOSE</b> — one size up, once' +
      '</div></div>';
  }
  if (tab === "spec"){
    h += '<div class="card"><h3>EVERYTHING ON THIS MODEL</h3>';
    m.feats.forEach(f=>{ h += '<div class="fr"><div class="fn" style="background:' + m.color +
      '">•</div><div><div class="fh">' + esc(f[0]) + '</div></div></div>'; });
    m.more.forEach(x=>{ h += '<div class="fr"><div class="fn" style="background:#3A4674;color:#fff">•</div>' +
      '<div><div class="fh">' + esc(x) + '</div></div></div>'; });
    h += '</div>';
  }
  return h;
}
function wireModel(){}

/* ---------------- QUIZ ---------------- */
let qi = 0, qScore = 0, qDone = false, qPicked = -1;
function vQuiz(){
  if (qi >= QUIZ.length){
    const pct = Math.round(qScore/QUIZ.length*100);
    const msg = pct >= 80 ? "Ready for the floor." :
                pct >= 50 ? "Close. Revise and try again." : "Go through the lessons once more.";
    return '<div class="card" style="text-align:center;padding:26px 16px">' +
      '<div class="score">' + qScore + '/' + QUIZ.length + '</div>' +
      '<div class="p" style="font-size:16px;font-weight:700;color:#fff;margin-top:10px">' + msg + '</div>' +
      '<div class="mut" style="margin-top:6px">' + pct + '% correct</div>' +
      '<button class="btn" id="again">Try again</button>' +
      '<button class="btn ghost" id="home2">Back to home</button></div>';
  }
  const q = QUIZ[qi];
  let h = '<div class="prog"><i style="width:' + (qi/QUIZ.length*100) + '%"></i></div>' +
    '<div class="card"><div class="qn">QUESTION ' + (qi+1) + ' OF ' + QUIZ.length + '</div>' +
    '<div class="qq">' + esc(q[0]) + '</div>';
  q[1].forEach((o,i)=>{
    let cls = "";
    if (qPicked > -1) cls = (i === q[2]) ? " ok" : (i === qPicked ? " no" : "");
    h += '<button class="opt' + cls + '" data-o="' + i + '"' +
         (qPicked > -1 ? " disabled" : "") + '>' + esc(o) + '</button>';
  });
  if (qPicked > -1){
    h += '<div class="exp"><b style="color:' + (qPicked===q[2] ? "#31B85C" : "#EF2B36") + '">' +
      (qPicked===q[2] ? "Correct" : "Not quite") + '</b> — ' + esc(q[3]) + '</div>' +
      '<button class="btn" id="next">' + (qi === QUIZ.length-1 ? "See result" : "Next question") + '</button>';
  }
  return h + '</div>';
}
function wireQuiz(){
  document.querySelectorAll("[data-o]").forEach(b=>{
    b.onclick = ev => {
      if (qPicked > -1) return;
      rippleAt(b,ev); qPicked = +b.dataset.o;
      if (qPicked === QUIZ[qi][2]){ qScore++; buzz(14); } else buzz([8,50,8]);
      $("screen").innerHTML = vQuiz(); wireQuiz();
    };
  });
  const n = $("next");
  if (n) n.onclick = () => { qi++; qPicked = -1; $("screen").innerHTML = vQuiz(); wireQuiz();
    window.scrollTo({top:0,behavior:"smooth"}); };
  const a = $("again");
  if (a) a.onclick = () => { qi = 0; qScore = 0; qPicked = -1; $("screen").innerHTML = vQuiz(); wireQuiz(); };
  const hb = $("home2");
  if (hb) hb.onclick = () => { qi = 0; qScore = 0; qPicked = -1; go("home"); };
}

/* ---------------- BOOT ---------------- */
render();
if ("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}

</script>
</body>
</html>
